
name: Faith Shorts Video Renderer

on:
  repository_dispatch:
    types: [render_video]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Generate faith-based video
        run: python renderer.py

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: faith-based-youtube-short
          path: output/faith_short.mp4
          if-no-files-found: error
          retention-days: 7
